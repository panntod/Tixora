services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tixora_app
    ports:
      - "8080:80"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - TIXORA_QR_SECRET=${TIXORA_QR_SECRET:-tixora-local-dev-secret-key-32chars}
    volumes:
      - uploads_data:/var/www/html/api/public/uploads

volumes:
  uploads_data:
