services:
  - type: web
    name: tixora-app
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tixora-db
          property: connectionString
      - key: AUTO_MIGRATE
        value: "true"
      - key: TIXORA_QR_SECRET
        generateValue: true

databases:
  - name: tixora-db
    plan: free
    databaseName: db_tixora
    user: postgres
    region: singapore
